name: Publish image

on:
  push:
    branches: [dev, prod]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/printscript-ui" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: <rama> (lo que despliega el stack) y <rama>-<sha> (para volver atrás).
      # Variables del repo (un solo tenant de Auth0 para dev y prod). La API, el WebSocket y el
      # redirect del login quedan en el mismo host que la UI (NGINX de snippet-searcher-infra).
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_OIDC_AUTHORITY=https://${{ vars.AUTH0_DOMAIN }}/
            VITE_OIDC_CLIENT_ID=${{ vars.AUTH0_SPA_CLIENT_ID }}
            VITE_OIDC_AUDIENCE=${{ vars.AUTH0_AUDIENCE }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.ref_name }}
            ${{ steps.meta.outputs.image }}:${{ github.ref_name }}-${{ steps.meta.outputs.sha }}

      # Despliega la imagen nueva: el workflow Deploy de snippet-searcher-infra corre el stack de
      # esta rama en su VM. DEPLOY_PAT: token clásico con el scope repo (ver ese repo)
      - name: Deploy
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_PAT }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY_OWNER}/snippet-searcher-infra/dispatches" \
            -f event_type=deploy -f "client_payload[environment]=${GITHUB_REF_NAME}"
